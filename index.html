<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강남 캠퍼스 자리배치도</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container {
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 36px 40px;
    max-width: 1100px;
    width: 100%;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 28px;
  }
  .legend {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }
  table {
    border-collapse: separate;
    border-spacing: 5px;
    width: 100%;
  }
  .cell {
    padding: 10px 8px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    border-radius: 8px;
    min-width: 60px;
    min-height: 40px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .person {
    background: #e8f4fd;
    color: #1a6fa8;
    border: 1.5px solid #b3d9f5;
    cursor: default;
  }
  .person:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(26,111,168,0.15);
    background: #d0eaf9;
  }
  .room {
    background: #fff3e0;
    color: #e65100;
    border: 1.5px solid #ffcc80;
    font-weight: 700;
    font-size: 12px;
  }
  .cabinet {
    background: #f3e5f5;
    color: #6a1b9a;
    border: 1.5px solid #ce93d8;
    font-weight: 600;
    font-size: 12px;
    writing-mode: vertical-rl;
  }
  .empty {
    background: transparent;
    border: none;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🏢 강남 캠퍼스 자리배치도</h1>
  <p class="subtitle">구글 시트와 자동 동기화됩니다</p>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#e8f4fd;border:1.5px solid #b3d9f5;"></div> 직원</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fff3e0;border:1.5px solid #ffcc80;"></div> 공간</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f3e5f5;border:1.5px solid #ce93d8;"></div> Cabinet</div>
  </div>
  <table>
    
  </table>
</div>
</body>
</html>
